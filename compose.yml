services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_FORMAT: json
      GATEWAY_CONFIG: /app/config/gateway.json
      # Container listen address; the host port is restricted to loopback below.
      GATEWAY_HOST: '0.0.0.0'
      GATEWAY_PORT: 18545
    volumes:
      - './config:/app/config:ro'
    ports:
      - '127.0.0.1:${GATEWAY_PUBLISH_PORT:-18545}:18545'
    healthcheck:
      test: [CMD, node, dist/checkHealth.js]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
